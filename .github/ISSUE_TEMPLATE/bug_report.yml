name: Bug Report
description: Create a report to help us improve dev-ai
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: input
    id: version
    attributes:
      label: dev-ai version
      description: What version of dev-ai are you using? (`dev-ai --help` shows it)
      placeholder: "e.g. 0.3.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: Which OS are you running on?
      placeholder: "e.g. Windows 11, Ubuntu 22.04, macOS 14"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      description: What Python version are you using?
      placeholder: "e.g. 3.11.0"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Tell us what you saw.
      placeholder: "A clear and concise description of the bug."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: |
        1. Run `dev-ai ...`
        2. See error
      placeholder: |
        1. `dev-ai ask "question"`
        2. Error message appears
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output or error messages.
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
